[package]
name = "opencontrol-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
opencontrol-protocol = { path = "../crates/opencontrol-protocol", features = ["legacy"] }

[[bin]]
name = "fuzz_session"
path = "fuzz_targets/fuzz_session.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_control_decoder"
path = "fuzz_targets/fuzz_control_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_datagram_decoder"
path = "fuzz_targets/fuzz_datagram_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_state_machine"
path = "fuzz_targets/fuzz_state_machine.rs"
test = false
doc = false
bench = false

