[package]
name = "opencontrol-protocol"
description = "Socket-independent OpenControl Protocol codecs and session primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../README.md"
repository = "https://github.com/nr084/opencontrol-protocol"

[features]
default = []
legacy = ["dep:blowfish"]

[dependencies]
bytes = "1"
thiserror = "2"
aes-gcm = "0.10"
getrandom = "0.2"
zeroize = "1"
subtle = "2"
blowfish = { version = "0.10", features = ["zeroize"], optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1"
hex = "0.4"

